[project]
name = "image-folder-to-excel-extractor"
version = "0.1.0"
description = "Local web app to extract structured data from images and export to Excel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "python-multipart==0.0.20",
  "pandas==2.3.2",
  "openpyxl==3.1.5",
  "requests==2.32.4",
  "Pillow==11.3.0",
  "easyocr==1.7.2",
  "jinja2==3.1.6",
]
